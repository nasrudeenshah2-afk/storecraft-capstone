# nginx for the storecraft console (used by web/Dockerfile and docker-compose.yml).
# Serves the built console and forwards the API to the primary on the same
# origin. "primary" is the compose service name.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The API accepts bodies up to 1 MiB and answers larger ones with its own
    # JSON error; let them through so nginx does not answer with an HTML 413.
    client_max_body_size 2m;

    location / {
        try_files $uri /index.html;
    }

    # Server-Sent Events: no buffering (each event must reach the browser at
    # once) and a long read timeout (the stream is long-lived; the server sends
    # a heartbeat every 15 s).
    location = /v1/changes/stream {
        proxy_pass http://primary:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # The rest of the API. /v1/changes long-polls for up to 25 s by default.
    location /v1/ {
        proxy_pass http://primary:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location = /metrics {
        proxy_pass http://primary:8080;
    }
}
